name: Playwright Tests
on:
  push:
    branches: [ feature_* ]
  pull_request:
    branches: [ main, Development ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    
    # Run tests based on branch context
    - name: Run tests tagged with new-feature (feature branches)
      if: startsWith(github.ref, 'refs/heads/feature_')
      run: npx playwright test --grep "@new-feature"
    
    - name: Run specific test files (PRs to Development)
      if: github.event_name == 'pull_request' && github.base_ref == 'Development'
      run: npx playwright test tests/homepage.spec.ts tests/other-critical-tests.spec.ts
    
    - name: Run all tests (PRs to main)
      if: github.event_name == 'pull_request' && github.base_ref == 'main'
      run: npx playwright test
    
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: results/playwright-report/
        retention-days: 30